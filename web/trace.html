<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeDB · Raft Trace Viewer</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2b;--line:#26334b;--muted:#93a4bd;--text:#e8eef8;--accent:#79b8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:32px 22px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:24px}
h1{font-size:26px;margin:0 0 4px}p{margin:0;color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,input,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit}
button{cursor:pointer;border-color:#42658e}button:hover{background:#1a2941}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}
.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat small{display:block;color:var(--muted)}.stat strong{font-size:20px;font-variant-numeric:tabular-nums}
.panel{padding:0;overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;background:#10182a;position:sticky;top:0}
tbody tr:hover{background:#172238}.time{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}.event{font-family:ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}
.pill{display:inline-block;padding:2px 7px;border-radius:20px;background:#22324a;color:#c9dcf5;font-size:11px}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
@media(max-width:700px){header{display:block}.tools{margin-top:16px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}th:nth-child(2),td:nth-child(2){display:none}}
</style>
</head>
<body>
<main>
<header>
 <div><h1>ForgeDB · Raft Trace Viewer</h1><p>Explore deterministic simulation events, message flow, and injected failures.</p></div>
 <div class="tools"><label for="file">Load trace JSON</label><input id="file" type="file" accept=".json,application/json"></div>
</header>
<section class="stats" aria-live="polite">
 <div class="stat"><small>Seed</small><strong id="seed">—</strong></div>
 <div class="stat"><small>Nodes</small><strong id="nodes">—</strong></div>
 <div class="stat"><small>Events shown</small><strong id="count">0</strong></div>
 <div class="stat"><small>Trace hash</small><strong id="hash" style="font-size:14px">—</strong></div>
</section>
<section class="panel">
 <div class="panel-head">
  <strong>Event timeline</strong>
  <div class="tools">
   <select id="kind" aria-label="Filter event type"><option value="">All event types</option><option>send</option><option>deliver</option><option>drop</option><option>lost</option><option>apply</option><option>CRASH</option><option>RESTART</option><option>VIOLATION</option></select>
   <input id="search" type="search" placeholder="Filter text…" aria-label="Filter trace text">
  </div>
 </div>
 <div id="empty" class="empty">Choose a trace JSON file generated by <code>go run ./cmd/trace</code>.</div>
 <div style="max-height:65vh;overflow:auto;display:none" id="table-wrap">
  <table><thead><tr><th>Virtual time</th><th>Type</th><th>Event</th></tr></thead><tbody id="rows"></tbody></table>
 </div>
</section>
</main>
<script>
const fileInput=document.querySelector("#file"),kind=document.querySelector("#kind"),search=document.querySelector("#search");
let events=[];
function category(line){const body=line.replace(/^t=\d+\s*/,"");const token=body.split(/[ \t]/,1)[0]||"event";return token.startsWith("lost(")?"lost":token}
function render(){
 const k=kind.value,q=search.value.toLowerCase(),filtered=events.filter(e=>(!k||category(e)===k)&&e.toLowerCase().includes(q));
 document.querySelector("#count").textContent=filtered.length.toLocaleString();
 const rows=document.querySelector("#rows");rows.replaceChildren();
 const fragment=document.createDocumentFragment();
 for(const line of filtered){
  const match=line.match(/^t=(\d+)\s*(.*)$/),tr=document.createElement("tr");
  const time=document.createElement("td");time.className="time";time.textContent=match?`${match[1]} ms`:"—";
  const type=document.createElement("td"),pill=document.createElement("span");pill.className="pill";pill.textContent=category(line);type.append(pill);
  const event=document.createElement("td");event.className="event";event.textContent=match?match[2]:line;
  tr.append(time,type,event);fragment.append(tr);
 }
 rows.append(fragment);
 document.querySelector("#empty").style.display=events.length?"none":"block";
 document.querySelector("#table-wrap").style.display=events.length?"block":"none";
 if(events.length&&filtered.length===0){document.querySelector("#empty").style.display="block";document.querySelector("#empty").textContent="No events match these filters."}
}
fileInput.addEventListener("change",async()=>{
 const file=fileInput.files?.[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(!Array.isArray(data.events)||typeof data.seed!=="number")throw new Error("This is not a ForgeDB trace file.");
  events=data.events;
  document.querySelector("#seed").textContent=data.seed;
  document.querySelector("#nodes").textContent=data.nodes??"—";
  document.querySelector("#hash").textContent=data.trace_hash??"—";
  render();
 }catch(err){events=[];render();document.querySelector("#empty").textContent=err.message}
});
kind.addEventListener("change",render);search.addEventListener("input",render);
</script>
</body>
</html>
